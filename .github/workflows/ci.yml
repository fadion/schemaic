name: CI

# Runs on every push to main and on pull requests. Lints once (Linux) and
# builds + tests on both Linux and Windows.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch/PR cancels the older in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint (fmt + clippy + deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # `apt-get update` has hung on GitHub's runners twice now — an hour on the
      # v0.16.0 release build, forty minutes on a v0.16.2 CI run — while other
      # jobs in the *same run* sailed through the identical step. A stalled mirror
      # or a held dpkg lock doesn't fail, it just sits, and a job's default
      # timeout is six hours, so nothing rescues it: the run has to be noticed by
      # a human and cancelled.
      #
      # So bound it twice. `timeout` caps each individual attempt, which turns a
      # stall into a quick non-zero exit the loop can retry — that is the part
      # that actually recovers, since retrying is exactly what worked by hand
      # both times. `timeout-minutes` is the backstop for the case where every
      # attempt stalls: the job then fails in minutes instead of burning an
      # afternoon. Failing all three attempts still falls through to the install,
      # which may well succeed against the image's existing package lists.
      - name: Install Linux GUI build dependencies
        timeout-minutes: 8
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if sudo timeout 120 apt-get update -o Acquire::Retries=3; then
              break
            fi
            echo "::warning::apt-get update stalled or failed (attempt $attempt of 3), retrying"
            sleep 5
          done
          sudo timeout 300 apt-get install -y libxkbcommon-dev libwayland-dev libxcb1-dev libx11-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all -- --check
      # `--features schemaic-db/live-tests` is what compiles the live engine
      # tier. The `test` job below cannot: that target declares the feature
      # `required-features`, so `cargo test --workspace` skips it entirely, and
      # without this it would be the one code in the repository no push
      # compiles — bitrotting quietly until the `live` job failed to build. It
      # needs no server to type-check, so it costs this job nothing.
      - name: Clippy (warnings = errors)
        run: cargo clippy --workspace --all-targets --features schemaic-db/live-tests -- -D warnings
      # Clippy does not check rustdoc, so a doc comment linking to a renamed or
      # deleted item shipped silently. `[workspace.lints.rustdoc]` allows links
      # from a public item to a private one (real references in an unpublished
      # workspace); what this catches is a link that resolves to nothing.
      #
      # `--document-private-items` is load-bearing, not thoroughness for its own
      # sake: `schemaic-ui` is `pub(crate)` almost end to end, so without it this
      # gate saw *none* of the crate that carries most of the app's prose. It sat
      # green over eleven dead links, two of them written by the commit that
      # renamed their target.
      - name: Rustdoc (warnings = errors)
        run: cargo doc --workspace --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings
      - name: License / advisory policy
        uses: EmbarkStudios/cargo-deny-action@v2

  test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # `macos-latest` is Apple Silicon, which is the only macOS target
        # Schemaic ships. It earns its place here more than the other two do:
        # nobody developing this has a Mac, so this job *is* the macOS
        # compiler — without it, breakage on that platform would surface for
        # the first time during a tagged release, after the tag is already
        # pushed. `fail-fast: false` above keeps a macOS failure from
        # cancelling the legs that do have someone watching them.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      # Bounded and retried for the reason spelled out on the lint job's copy of
      # this step above.
      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 8
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if sudo timeout 120 apt-get update -o Acquire::Retries=3; then
              break
            fi
            echo "::warning::apt-get update stalled or failed (attempt $attempt of 3), retrying"
            sleep 5
          done
          sudo timeout 300 apt-get install -y libxkbcommon-dev libwayland-dev libxcb1-dev libx11-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace
      - name: Test
        run: cargo test --workspace

  # The DB layer against real servers. Everything above this line is pure — the
  # `test` job's `cargo test --workspace` does not build the live target at all —
  # so this job is the only thing in CI that has ever connected to MySQL,
  # MariaDB or PostgreSQL. SQLite was the one backend covered directly, and the
  # two engines that ship most were covered by hand.
  #
  # **It blocks, like every other job here.** An advisory live tier stops being
  # read within a month, and a suite nobody reads is worse than none: it looks
  # like coverage.
  #
  # Linux only, and out of the `test` matrix on purpose — the Windows and macOS
  # legs stay pure and fast, and a server that failed to come up cannot mask a
  # compile break on a platform nobody develops on.
  live:
    name: Live engines (MySQL + MariaDB + PostgreSQL)
    runs-on: ubuntu-latest
    # **The one job here that talks to something that can stop answering.** Every
    # other job either compiles or does not; this one waits on three servers, a
    # channel and a `DROP DATABASE` that a held transaction can block. Without a
    # ceiling a wedged test holds a runner for the full six-hour default, and the
    # failure reads as "still running" rather than as itself. Generous against a
    # cold service container — the whole tier runs in ~10 s locally.
    timeout-minutes: 15
    services:
      # MariaDB is a leg of its own rather than a MySQL stand-in: the two
      # diverge in exactly what the DB layer reads — `information_schema`,
      # `CHECK` clause escaping, JSON, sequences — and a MySQL 8 quirk in
      # `CHECK_CLAUSE` has already hidden behind a MariaDB that returned
      # runnable text.
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: schemaic
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: schemaic
        # 3307, matching the local test bed, so the defaults in
        # `tests/live/endpoint.rs` describe both places.
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: schemaic
          POSTGRES_PASSWORD: schemaic
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U schemaic"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v5
      # No GUI packages: this builds `schemaic-db` and `schemaic-core` only,
      # neither of which pulls in floem.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # **The root account, not `schemaic`.** A `MYSQL_USER` created by the image
      # is granted rights on `MYSQL_DATABASE` alone, so it cannot create the
      # scratch database each test works in. PostgreSQL's `POSTGRES_USER` is the
      # cluster superuser and needs no such exception.
      - name: Test (live)
        run: cargo test -p schemaic-db --features live-tests
        env:
          SCHEMAIC_IT_MARIADB_USER: root
          SCHEMAIC_IT_MARIADB_PASSWORD: schemaic
          SCHEMAIC_IT_MYSQL_USER: root
          SCHEMAIC_IT_MYSQL_PASSWORD: schemaic
          SCHEMAIC_IT_PG_USER: schemaic
          SCHEMAIC_IT_PG_PASSWORD: schemaic
