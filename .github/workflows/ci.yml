name: CI

# Runs on every push to main and on pull requests. Lints once (Linux) and
# builds + tests on both Linux and Windows.
on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch/PR cancels the older in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint (fmt + clippy + deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb1-dev libx11-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy (warnings = errors)
        run: cargo clippy --workspace --all-targets -- -D warnings
      # Clippy does not check rustdoc, so a doc comment linking to a renamed or
      # deleted item shipped silently. `[workspace.lints.rustdoc]` allows links
      # from a public item to a private one (real references in an unpublished
      # workspace); what this catches is a link that resolves to nothing.
      #
      # `--document-private-items` is load-bearing, not thoroughness for its own
      # sake: `schemaic-ui` is `pub(crate)` almost end to end, so without it this
      # gate saw *none* of the crate that carries most of the app's prose. It sat
      # green over eleven dead links, two of them written by the commit that
      # renamed their target.
      - name: Rustdoc (warnings = errors)
        run: cargo doc --workspace --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings
      - name: License / advisory policy
        uses: EmbarkStudios/cargo-deny-action@v2

  test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb1-dev libx11-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace
      - name: Test
        run: cargo test --workspace
