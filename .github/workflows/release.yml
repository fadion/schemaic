name: Release

# Fires when you push a version tag, e.g.:
#     git tag v0.1.0
#     git push origin v0.1.0
# Builds a release binary on each OS and attaches it to a GitHub Release for
# that tag (created automatically if it doesn't exist yet).
#
# `workflow_dispatch` runs everything *except* the three publish steps, which
# are gated on `github.ref_type == 'tag'`. That exists because a tag is the
# expensive way to discover a packaging mistake: the tag is already pushed and
# awkward to retract by the time the job fails. A manual run builds and packs
# every leg with nothing at stake, which is how the macOS leg was proven before
# it ever saw a version number.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Needed so the workflow can create the Release and upload assets.
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # `channel` is Velopack's, and it must be **explicit and unique per
          # os/rid** — left to default it would be plain `win` and `linux`, and
          # the channel only reaches the *manifest* name in that case: both
          # platforms would then emit a package called
          # `Schemaic-<version>-full.nupkg`, which two jobs cannot both upload to
          # one GitHub Release. Worse than the upload failing, `GithubSource`
          # resolves a package by matching its file name across the release's
          # assets, so a Linux client following `releases.linux.json` would be
          # handed whichever asset won that name — quite possibly the Windows
          # build. Naming a non-default channel puts it in every file name
          # instead (`Schemaic-<version>-win-x64-full.nupkg`), which is what
          # keeps the two sets apart. Changing it later orphans installs.
          - os: ubuntu-latest
            target: linux-x86_64
            channel: linux-x64
          - os: windows-latest
            target: windows-x86_64
            channel: win-x64
          # Apple Silicon only. Intel Macs would need their own permanent
          # channel (`osx-x64`); adding one later is safe, renaming this one is
          # not, which is why it says `arm64` rather than a bare `osx`.
          - os: macos-latest
            target: macos-arm64
            channel: osx-arm64
    steps:
      - uses: actions/checkout@v5

      # The version every leg packs with, resolved in one place because the
      # three `vpk pack` steps used to each derive it their own way — and
      # because on a `workflow_dispatch` there is no tag to derive it from.
      # Falls back to the workspace version, which is what the next tag will
      # carry anyway.
      - name: Resolve the package version
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            v="${GITHUB_REF_NAME#v}"
          else
            v="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
            echo "::notice::No tag; packing the workspace version $v as a dry run"
          fi
          echo "VPK_VERSION=$v" >> "$GITHUB_ENV"

      # Bounded and retried: `apt-get update` hung here for an hour on the v0.16.0
      # release and had to be cancelled and re-run by hand, and again on a CI run
      # a release later. A stalled mirror or held lock never fails on its own, and
      # a job runs six hours before GitHub intervenes. `timeout` turns each stall
      # into a fast failure the loop retries — which is what the manual re-run was
      # doing — and `timeout-minutes` bounds the whole step. Matters more here than
      # in CI: this one runs after a tag is already pushed, where a wedged job
      # holds up a release that is halfway out the door. See `ci.yml` for the
      # fuller note.
      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 8
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if sudo timeout 120 apt-get update -o Acquire::Retries=3; then
              break
            fi
            echo "::warning::apt-get update stalled or failed (attempt $attempt of 3), retrying"
            sleep 5
          done
          # `rpm` is here rather than in an apt call of its own so there is one
          # bounded, retried install on this runner instead of two. It provides
          # rpmbuild, which packaging/linux/build-rpm.sh drives; the spec compiles
          # nothing, so a Debian-hosted rpmbuild is enough.
          sudo timeout 300 apt-get install -y libxkbcommon-dev libwayland-dev libxcb1-dev libx11-dev pkg-config rpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Linux: build against an older glibc (2.31 = Ubuntu 20.04 / Debian 11) with
      # cargo-zigbuild, so the binary runs on distros older than the CI runner
      # (which is glibc 2.39). glibc is not backward-compatible, so a binary linked
      # against the runner's glibc would fail on older systems.
      - name: Install Zig (Linux)
        if: runner.os == 'Linux'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0
      - name: Install cargo-zigbuild (Linux)
        if: runner.os == 'Linux'
        run: cargo install --locked cargo-zigbuild

      - name: Build release binary (Linux, glibc 2.31)
        if: runner.os == 'Linux'
        run: cargo zigbuild --release -p schemaic-app --target x86_64-unknown-linux-gnu.2.31

      - name: Build release binary (Windows)
        if: runner.os == 'Windows'
        run: cargo build --release -p schemaic-app

      # Native: the runner is Apple Silicon and `osx-arm64` is the only macOS
      # channel, so there is no cross-compilation and no glibc floor to hold —
      # macOS versions its own SDK, and the deployment target the toolchain
      # picks covers everything Apple still supports.
      - name: Build release binary (macOS, arm64)
        if: runner.os == 'macOS'
        run: cargo build --release -p schemaic-app

      # Stage the binary alongside the license notices that must ship with a
      # distributed build, then archive (.tar.gz on Linux, .zip on Windows).
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir dist
          cp target/x86_64-unknown-linux-gnu/release/schemaic dist/
          cp LICENSE THIRD-PARTY-NOTICES.md README.md dist/
          cp crates/schemaic-ui/fonts/LICENSE.txt dist/IBMPlex-OFL.txt
          cp licenses/Lucide-LICENSE.txt dist/
          tar czf "schemaic-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" -C dist .

      # ── Distribution packages ────────────────────────────────────────────
      # A .deb and an .rpm around the same binary the archive above wraps.
      # These are *convenience* packaging, not an update channel: an install
      # under /usr/bin is not a Velopack install, so `UpdateManager::new` fails
      # there, `check_gate` returns `NotInstalled` and the in-app update check
      # correctly never runs. What they buy is a desktop entry, an icon,
      # AppStream metadata for the software centres, dependency resolution and
      # a clean uninstall. Updates come from re-running install.sh until there
      # is an apt/dnf repository to point at.
      #
      # Both wrap the *same* staged payload (packaging/linux/stage-payload.sh),
      # so the two formats cannot drift into shipping different files.
      - name: Build the .deb and .rpm (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          binary=target/x86_64-unknown-linux-gnu/release/schemaic
          bash packaging/linux/build-deb.sh "$VPK_VERSION" "$binary" dist-packages
          bash packaging/linux/build-rpm.sh "$VPK_VERSION" "$binary" dist-packages
          ls -l dist-packages

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/schemaic.exe dist/
          Copy-Item LICENSE, THIRD-PARTY-NOTICES.md, README.md dist/
          Copy-Item crates/schemaic-ui/fonts/LICENSE.txt dist/IBMPlex-OFL.txt
          Copy-Item licenses/Lucide-LICENSE.txt dist/
          Compress-Archive -Path dist/* -DestinationPath "schemaic-${{ github.ref_name }}-${{ matrix.target }}.zip"

      # macOS gets no archive of its own: `vpk` emits the .app itself, and a
      # ditto-zipped .app is a better macOS deliverable than a tarred bare
      # binary would be. What is staged here is only the input `vpk` builds the
      # bundle from.
      - name: Stage the payload (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          mkdir dist
          cp target/release/schemaic dist/
          cp LICENSE THIRD-PARTY-NOTICES.md README.md dist/
          cp crates/schemaic-ui/fonts/LICENSE.txt dist/IBMPlex-OFL.txt
          cp licenses/Lucide-LICENSE.txt dist/

      # `vpk` validates that --icon ends in .icns, and macOS is the only place
      # that can build one. `sips` and `iconutil` ship with the OS, so the PNG
      # stays the single source of truth rather than a second icon checked in
      # beside it, quietly drifting. 512@2x consumes icon-1024.png whole, which
      # is why that is the source rather than the 512 one.
      - name: Build the .icns (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          mkdir -p icon.iconset
          for sz in 16 32 128 256 512; do
            sips -z $sz $sz assets/icon-1024.png --out "icon.iconset/icon_${sz}x${sz}.png" >/dev/null
            sips -z $((sz * 2)) $((sz * 2)) assets/icon-1024.png --out "icon.iconset/icon_${sz}x${sz}@2x.png" >/dev/null
          done
          iconutil -c icns icon.iconset -o icon.icns
          ls -l icon.icns

      # ── Velopack: the auto-updating artifacts ────────────────────────────
      # The archives above stay as the *portable* artifacts (no auto-update, no
      # install); everything below produces the primary ones — a per-user
      # Setup.exe that installs to %LocalAppData% with no UAC prompt on Windows,
      # a self-updating .AppImage on Linux, and the packages each installed app
      # polls this same Release for.
      #
      # **These are unsigned, deliberately** — see the packaging section of the
      # private todo.md. A self-signed certificate would buy nothing here (it
      # chains to no trusted root, so SmartScreen still says "Unknown publisher"
      # and no reputation accrues), so this ships honestly unsigned until a real
      # cert exists. Adding one later is a `--signParams` argument on `vpk pack`,
      # not a rework of any of this.
      #
      # Pinned rather than relying on whatever SDK the runner image ships, since
      # `vpk` is a .NET global tool and the runner's default has moved before.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install the Velopack CLI
        run: dotnet tool install -g vpk

      # Still fetched even though `--delta None` means nothing is diffed against
      # it: `vpk pack` reads the previous release to carry its entry forward into
      # `releases.<channel>.json`, and a feed that lists only the newest version
      # is a feed with no history. The channel must match the one we pack with,
      # or it fetches the *other* platform's history.
      #
      # Non-fatal by design: the first tagged release has no predecessor.
      #
      # `--timeout` is in **minutes** and defaults to **30**, which pairs badly
      # with `continue-on-error`: the two together turn an unreachable or slow
      # feed into half an hour of a runner sitting still, per leg, before
      # shrugging and carrying on. 5 is roughly sixty times what the real work
      # needs (~25 MB from GitHub's CDN, seconds on a runner), so it never binds
      # in the good case and caps the bad one at something survivable.
      - name: Fetch the previous release for the feed's history
        continue-on-error: true
        run: vpk download github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }} --channel ${{ matrix.channel }} --timeout 5

      # Both pack steps run over the same `dist/` the portable archive was built
      # from, so the installed app carries the licence notices too. `--packId` is
      # the app's permanent identity: an installed app only accepts updates
      # carrying the *same* id, so changing it later orphans every install.
      #
      # `--noPortable` on Windows because we already publish our own portable
      # .zip and two of them would just be confusing. There is no such flag in
      # play on Linux — there the AppImage *is* the portable artifact, and it is
      # the thing that self-updates.
      #
      # **`--delta None` is not a performance choice, it is a correctness one, and
      # it should not be reverted without understanding this.** Deltas broke the
      # second consecutive update. A client that reaches version N by applying a
      # delta ends up with a *locally reassembled* package for N, not the one CI
      # built: v0.16.1's package was 23,606,057 bytes on the release and
      # 23,605,881 on disk after reassembly, with a different SHA1. The delta for
      # N+1 is computed against CI's copy, so it is being applied to a base the
      # build never saw. v0.16.0 → v0.16.1 worked only because that base arrived
      # whole from Setup.exe; v0.16.1 → v0.16.2 failed silently in the field.
      # Full packages always verify against the manifest, whatever route the
      # client took to get where it is. The cost is roughly 15 MB per update on
      # Windows — and next to nothing on Linux, where the delta was saving 16%
      # against a compressed AppImage anyway.
      - name: Package with Velopack (Windows)
        if: runner.os == 'Windows'
        run: |
          vpk pack `
            --packId Schemaic `
            --packVersion $env:VPK_VERSION `
            --packDir dist `
            --mainExe schemaic.exe `
            --packTitle Schemaic `
            --packAuthors "Schemaic contributors" `
            --icon assets/icon.ico `
            --channel ${{ matrix.channel }} `
            --delta None `
            --noPortable

      # `--icon` is *required* on Linux and must be a PNG — vpk builds the AppDir
      # (with its .desktop entry and icon) from the pack directory, which is also
      # what finally gives the Linux build a desktop icon. `--categories` fills the
      # .desktop `Categories=` field; Development is the freedesktop menu section a
      # SQL editor belongs in.
      - name: Package with Velopack (Linux)
        if: runner.os == 'Linux'
        run: |
          vpk pack \
            --packId Schemaic \
            --packVersion "$VPK_VERSION" \
            --packDir dist \
            --mainExe schemaic \
            --packTitle Schemaic \
            --packAuthors "Schemaic contributors" \
            --icon assets/icon.png \
            --categories Development \
            --channel ${{ matrix.channel }} \
            --delta None

      # Unsigned and un-notarized, the same decision the Windows installer
      # carries: an Apple Developer ID is a paid, ongoing thing and this is not
      # yet an app with an audience to justify it. `vpk` warns and carries on.
      # Gatekeeper is the cost, and the README says how to get past it.
      #
      # `--bundleId` is the same reverse-DNS id the Linux desktop entry and
      # AppStream metadata use, so one identity covers every platform. It is
      # mutually exclusive with `--plist`; pass one or the other, never both.
      #
      # No `--noPortable` here, unlike Windows: on macOS the portable artifact
      # is a ditto zip of the .app, which is exactly what someone dragging it
      # to /Applications wants. On Windows it would be a second, redundant
      # portable next to the .zip we build ourselves.
      - name: Package with Velopack (macOS)
        if: runner.os == 'macOS'
        run: |
          vpk pack \
            --packId Schemaic \
            --packVersion "$VPK_VERSION" \
            --packDir dist \
            --mainExe schemaic \
            --packTitle Schemaic \
            --packAuthors "Schemaic contributors" \
            --icon icon.icns \
            --bundleId io.github.fadion.Schemaic \
            --channel ${{ matrix.channel }} \
            --delta None

      # `ref_type` rather than `event_name`: a dispatch has no tag to publish
      # against, and `softprops/action-gh-release` would create a release named
      # after the branch. Skipped on macOS too — that leg builds no archive of
      # its own, and this step is left strict (no `fail_on_unmatched_files`) so
      # that a *missing* Linux or Windows archive still fails the release, which
      # is the mistake worth catching here.
      - name: Publish to the GitHub Release
        if: github.ref_type == 'tag' && runner.os != 'macOS'
        uses: softprops/action-gh-release@v2
        with:
          files: schemaic-${{ github.ref_name }}-${{ matrix.target }}.*

      # Uploaded separately from the archives above, and scoped to *this* version
      # and channel on purpose: the fetch step above leaves the previous
      # release's .nupkg sitting in `Releases/` too, and a bare `Releases/*` glob
      # would re-attach it to the new Release. `releases.<channel>.json` is the
      # manifest installed apps poll, so it must be here for auto-update to work
      # at all.
      #
      # **No delta package is listed, and that is deliberate** — see `--delta
      # None` above. A `*-delta.nupkg` appearing here would mean deltas had been
      # switched back on, so leaving the glob out keeps this list an accurate
      # statement of what a release contains rather than a wish.
      #
      # `fail_on_unmatched_files: false` because each job names both platforms'
      # primary artifacts while only ever producing its own — one step covering
      # both beats two nearly identical OS-gated ones.
      - name: Publish the Velopack artifacts
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Releases/Schemaic-${{ matrix.channel }}-Setup.exe
            Releases/Schemaic-${{ matrix.channel }}.AppImage
            Releases/Schemaic-${{ matrix.channel }}-Setup.pkg
            Releases/Schemaic-${{ matrix.channel }}-Portable.zip
            Releases/Schemaic-${{ env.VPK_VERSION }}-${{ matrix.channel }}-full.nupkg
            Releases/releases.${{ matrix.channel }}.json
          fail_on_unmatched_files: false

      # Separate from the two publish steps above because the file names carry
      # each format's own version convention (`schemaic_0.16.3_amd64.deb`,
      # `schemaic-0.16.3-1.x86_64.rpm`) and match neither the archive glob nor
      # the Velopack one.
      - name: Publish the distribution packages
        if: github.ref_type == 'tag' && runner.os == 'Linux'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-packages/*.deb
            dist-packages/*.rpm
