name: Release

# Fires when you push a version tag, e.g.:
#     git tag v0.1.0
#     git push origin v0.1.0
# Builds a release binary on each OS and attaches it to a GitHub Release for
# that tag (created automatically if it doesn't exist yet).
on:
  push:
    tags: ["v*"]

# Needed so the workflow can create the Release and upload assets.
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Release (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: windows-latest
            target: windows-x86_64
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb1-dev libx11-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Linux: build against an older glibc (2.31 = Ubuntu 20.04 / Debian 11) with
      # cargo-zigbuild, so the binary runs on distros older than the CI runner
      # (which is glibc 2.39). glibc is not backward-compatible, so a binary linked
      # against the runner's glibc would fail on older systems.
      - name: Install Zig (Linux)
        if: runner.os == 'Linux'
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0
      - name: Install cargo-zigbuild (Linux)
        if: runner.os == 'Linux'
        run: cargo install --locked cargo-zigbuild

      - name: Build release binary (Linux, glibc 2.31)
        if: runner.os == 'Linux'
        run: cargo zigbuild --release -p schemaic-app --target x86_64-unknown-linux-gnu.2.31

      - name: Build release binary (Windows)
        if: runner.os == 'Windows'
        run: cargo build --release -p schemaic-app

      # Stage the binary alongside the license notices that must ship with a
      # distributed build, then archive (.tar.gz on Linux, .zip on Windows).
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir dist
          cp target/x86_64-unknown-linux-gnu/release/schemaic dist/
          cp LICENSE THIRD-PARTY-NOTICES.md README.md dist/
          cp crates/schemaic-ui/fonts/LICENSE.txt dist/IBMPlex-OFL.txt
          cp licenses/Lucide-LICENSE.txt dist/
          tar czf "schemaic-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" -C dist .

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/schemaic.exe dist/
          Copy-Item LICENSE, THIRD-PARTY-NOTICES.md, README.md dist/
          Copy-Item crates/schemaic-ui/fonts/LICENSE.txt dist/IBMPlex-OFL.txt
          Copy-Item licenses/Lucide-LICENSE.txt dist/
          Compress-Archive -Path dist/* -DestinationPath "schemaic-${{ github.ref_name }}-${{ matrix.target }}.zip"

      # ── Velopack: the auto-updating Windows installer ────────────────────
      # The .zip above stays as the *portable* artifact (no auto-update, no
      # install); everything below produces the primary one — a per-user
      # Setup.exe that installs to %LocalAppData% with no UAC prompt, and the
      # packages the installed app polls this same Release for.
      #
      # **These are unsigned, deliberately** — see the packaging section of the
      # private todo.md. A self-signed certificate would buy nothing here (it
      # chains to no trusted root, so SmartScreen still says "Unknown publisher"
      # and no reputation accrues), so this ships honestly unsigned until a real
      # cert exists. Adding one later is a `--signParams` argument on `vpk pack`,
      # not a rework of any of this.
      - name: Install the Velopack CLI (Windows)
        if: runner.os == 'Windows'
        run: dotnet tool install -g vpk

      # The previous release's packages, so `vpk pack` can compute a delta against
      # them — an update then downloads only what changed instead of the whole
      # app. Non-fatal by design: the first tagged release has no predecessor to
      # fetch, and a missing delta only costs bandwidth, never correctness.
      - name: Fetch the previous release for delta computation (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: vpk download github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }}

      # Packs the same `dist/` the portable .zip was built from, so the installed
      # app carries the licence notices too. `--noPortable` because we already
      # publish our own portable .zip and two of them would just be confusing.
      # `--packId` is the app's permanent identity: an installed app only accepts
      # updates carrying the *same* id, so changing it later orphans every
      # existing install.
      - name: Package with Velopack (Windows)
        if: runner.os == 'Windows'
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          vpk pack `
            --packId Schemaic `
            --packVersion $version `
            --packDir dist `
            --mainExe schemaic.exe `
            --packTitle Schemaic `
            --packAuthors "Schemaic contributors" `
            --icon assets/icon.ico `
            --noPortable
          "VPK_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Publish to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: schemaic-${{ github.ref_name }}-${{ matrix.target }}.*

      # Uploaded separately from the archives above, and scoped to *this*
      # version's file names on purpose: the delta step above leaves the previous
      # release's .nupkg files sitting in `Releases/` too, and a bare `Releases/*`
      # glob would re-attach those to the new Release. `releases.win.json` is the
      # manifest installed apps poll, so it must be here for auto-update to work
      # at all.
      - name: Publish the Velopack artifacts (Windows)
        if: runner.os == 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Releases/*Setup.exe
            Releases/Schemaic-${{ env.VPK_VERSION }}-full.nupkg
            Releases/Schemaic-${{ env.VPK_VERSION }}-delta.nupkg
            Releases/releases.win.json
          fail_on_unmatched_files: false
