[workspace]
resolver = "2"
members = [
    "crates/schemaic-core",
    "crates/schemaic-db",
    "crates/schemaic-ai",
    "crates/schemaic-term",
    "crates/schemaic-ui",
    "crates/schemaic-app",
]

# CI runs `cargo doc` with `-D warnings`, so a doc comment that points at
# something no longer there fails the build — the class that let `history.rs`
# link a `MAX_ENTRIES` renamed to `MAX_PER_CONN` while describing the wrong
# cap. `private_intra_doc_links` is *not* that class: these crates are internal,
# nothing is published, and a link from a public item to a private one is a real
# reference a developer follows in the source. Only unresolved links are drift.
[workspace.lints.rustdoc]
private_intra_doc_links = "allow"

[workspace.package]
version = "0.22.0"
edition = "2024"
license = "MIT"
authors = ["Schemaic contributors"]

[workspace.dependencies]
# Internal crates
schemaic-core = { path = "crates/schemaic-core" }
schemaic-db = { path = "crates/schemaic-db" }
schemaic-ai = { path = "crates/schemaic-ai" }
schemaic-term = { path = "crates/schemaic-term" }
schemaic-ui = { path = "crates/schemaic-ui" }

# UI
# `rfd-tokio` enables the native file picker (`file_action::open_file`), used by
# the Manage-Connections SSH key-pair "Browse…" button.
#
# **`image-gif` / `image-bmp` are the binary-cell panel's preview**, and they are
# here rather than left off because the alternative is worse than a missing
# feature: `img()` renders whatever it can decode and draws *nothing* for what it
# cannot, so a GIF in a BLOB would open a panel that says "GIF image · 12 KB"
# above an empty box. floem's `default-image-formats` covers PNG, JPEG, WebP and
# ICO; these two close the gap between what `blob::sniff` can name and what the
# renderer can show, and `blob::BlobKind::is_image` is the list of both.
#
# They are not free in the same way: `image-bmp` is a decoder already inside the
# `image` crate floem compiles, and costs nothing but the code; `image-gif`
# pulls `gif` 0.14 — a *second* copy alongside the 0.13 resvg already brings in,
# which `cargo deny`'s `bans` allows and which is the whole price. Pure Rust,
# MIT/Apache, and the alternative was a panel captioned "GIF image" over an
# empty box.
floem = { version = "0.2.0", features = ["rfd-tokio", "image-gif", "image-bmp"] }

# Async / DB (wired in M1)
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }
tokio-util = "0.7"
# Async MySQL/MariaDB driver. We need per-column wire metadata (org_table /
# org_name / key flags) for the editing system — sqlx's MySQL driver discards it.
# `minimal` = no compression; `rustls-tls` is the TLS backend, chosen over
# `native-tls-tls` so a Linux release binary needs no system OpenSSL and the
# handshake behaves identically on both platforms — see `db::tls`.
#
# **0.37, not 0.34, for a dependency reason rather than an API one** (the bump
# was a drop-in: not one call site changed). 0.34 declares its `rustls`
# dependency with default features, which enables rustls' `aws_lc_rs` provider —
# the aws-lc-sys C/cmake/NASM build this workspace avoids everywhere else, *and*
# a second provider alongside the `ring` that velopack → ureq already selects.
# Two providers is not merely redundant: `ClientConfig::builder()` cannot then
# name one from crate features and panics at the first handshake unless a
# process-level default is installed. 0.37 declares it `default-features =
# false`, so the tree has exactly one provider and nothing to install.
mysql_async = { version = "0.37", default-features = false, features = [
    "minimal",
    "rustls-tls",
] }
# Async PostgreSQL driver (second engine). Result values come back over the
# simple-query (text) protocol, so NUMERIC and any exotic type round-trip
# losslessly as their text form (mirrors the MySQL text path).
tokio-postgres = "0.7"
futures-util = "0.3"
# SQLite (third engine). `bundled` compiles SQLite's own amalgamation in, so there
# is no system library to find and the version is the one we tested against;
# SQLite is public domain, so it adds no licence obligation for `cargo deny`.
# `column_metadata` sets SQLITE_ENABLE_COLUMN_METADATA, which is what makes
# `sqlite3_column_table_name`/`origin_name` available — the same per-column
# provenance the editing system needs from MySQL's org_table/org_name, and without
# it no SQLite result would be editable at all. The driver is *blocking*, so every
# call runs inside `spawn_blocking`; that suits the one-connection-per-operation
# invariant, which already opens and closes a connection per call.
rusqlite = { version = "0.32", features = ["bundled", "column_decltype"] }
# TLS for the two networked engines. One stack for both, so `verify-ca` and
# `verify-full` mean the same thing whichever engine is behind them — the
# alternative is two verifiers with two sets of edge cases and one test-bed that
# only ever exercised one of them.
#
# `ring` rather than the default `aws-lc-rs`, for the same reason russh below
# pins it: it avoids the aws-lc-sys C/cmake/NASM build in CI. Every crate in the
# tree that reaches rustls must agree — features are additive, so one
# default-featured dependency enables the second provider for everybody, and
# rustls then refuses to pick one from crate features at all. `cargo tree -e
# features -i rustls` is the check; exactly one `rustls feature "…"` provider
# line should appear.
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
    "logging",
] }
rustls-pki-types = "1"
# The OS certificate store, which is what an empty CA path resolves to — see
# `db::tls::default_roots`. `webpki-roots` stays as the fallback for a machine
# with no store to read (a scratch container with no `ca-certificates`).
#
# **Version 1, to match `mysql_async`'s.** The workspace held 0.26 while the
# driver depended on 1.0, so in the bundled fallback — the one case where the
# driver's own built-in roots are deliberately left switched on, because they
# *are* our set — PostgreSQL verified against one Mozilla snapshot and MySQL
# against another. `db::tls`'s opening promise is that both engines verify
# against the same anchors, and the guard test asserts `!disable_built_in_roots`
# and so cannot see the difference. Same one-provider argument the workspace
# already makes for `ring`.
rustls-native-certs = "0.8"
webpki-roots = "1"
tokio-postgres-rustls = "0.13"
# SSH tunnelling. Use the `ring` crypto backend instead of the default
# `aws-lc-rs` to avoid the aws-lc-sys C/cmake build.
russh = { version = "0.62", default-features = false, features = ["ring", "flate2", "rsa"] }
# Version pinned to match russh's transitive dependency (for `ssh_key::PublicKey`).
ssh-key = "=0.7.0-rc.11"

# Installer + auto-update framework. The `vpk` CLI builds the Setup.exe / delta
# packages in `release.yml`; this crate is the in-process half — the startup hook
# that services the installer's `--veloapp-*` re-invocations, and the
# `UpdateManager` that polls the GitHub Releases feed. The API is **synchronous**
# and does network + file IO, so every call of it runs on a worker thread and comes
# back through Floem's async→UI seam, never on the UI thread.
velopack = "1.2"

# Process resource sampling for the status-bar CPU/RAM readout (cross-platform:
# Windows/macOS/Linux). `default-features = false` + `system` = just the
# CPU/memory/process reader, no disk/network/component/user probes.
sysinfo = { version = "0.33", default-features = false, features = ["system"] }

# The **local** wall clock, and nothing else. `core::date` does its own civil
# arithmetic (Howard Hinnant's day↔date pair, unit-tested), but "which day is
# today" cannot be answered from `std`: `SystemTime` is UTC, and a date picker
# that highlights yesterday between local midnight and the UTC offset is wrong at
# exactly the hours somebody is most likely to be looking at it. Already in the
# tree via russh → russh-util, so it costs no compile; `default-features = false`
# + `clock` is the timezone-aware `Local::now()` without chrono's serde,
# formatting or `oldtime` surface.
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# SQL parsing. Pure-Rust, per-dialect AST (MySqlDialect now; Postgres/SQLite are
# dialect swaps for the multi-DB future). Drives the editor's structure-aware
# completion + catalog diagnostics; the hand-built `skip_noncode` lexer stays for
# byte positions + mid-edit fallback (sqlparser isn't error-tolerant). The `visitor`
# feature powers the unqualified-column diagnostic (walking the AST for column refs).
sqlparser = { version = "0.62", features = ["visitor"] }

# Errors / logging / serde
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
# `raw_value` lets `core::jsontree` walk a JSON document without ever handing a
# number to an `f64` — see its module doc. Deliberately *not* `arbitrary_precision`,
# which would change `Value`'s number handling crate-wide, for export and import too.
serde_json = { version = "1", features = ["raw_value"] }
# CSV *reading* for the import path. Writing it is a few lines (see
# `core::export::csv_field`); reading it correctly — quotes, embedded delimiters
# and newlines, escapes, BOMs — is not, and a hand-rolled parser here would lose
# data quietly.
csv = "1"
# Excel `.xlsx`, the sixth export format and the third import one. Two crates,
# because reading and writing OOXML are not the same problem and no crate does
# both well.
#
# `rust_xlsxwriter` writes. **`constant_memory` is the reason for the feature
# list**: without it a workbook lives entirely in RAM until it is zipped, which
# on this app's own target result (200k x 50) is a gigabyte of cell structs to
# emit a file the user asked to *stream*. In that mode each row's XML is spilled
# to a library-managed temp file as soon as the next row starts, so the export
# costs a buffer at any row count — the same bound `RowChunks` exists to give
# every other format. It is the one place in `schemaic-core` whose tests touch
# the filesystem; `export::export_xlsx_chunks` states why.
#
# `calamine` reads. Note the quick-xml it pulls is **0.41**, the version that
# fixes RUSTSEC-2026-0194/0195 — which matters here and nowhere else in the
# tree: an imported `.xlsx` is the first untrusted XML this app has ever parsed
# (see `deny.toml`, where those two advisories are ignored for the *trusted*
# bundled-SVG parser floem reaches through usvg).
rust_xlsxwriter = { version = "0.99", features = ["constant_memory"] }
calamine = "0.36"

# Profiling build: release-grade optimization (so we measure real perf, not a slow
# debug build) but with full debug symbols so a sampling profiler (samply, etc.) can
# resolve stacks. Build with `cargo build --profile profiling -p schemaic-app`, then
# `samply record target/profiling/schemaic.exe`. Kept separate from `release`.
[profile.profiling]
inherits = "release"
debug = true

# Dev-build performance. The app's per-frame work while scrolling lives almost
# entirely in dependencies — Floem's layout/`virtual_stack`, `cosmic-text` shaping,
# the vger/wgpu renderer — which run an order of magnitude slower when compiled
# unoptimized. That was the "glitchy fast scrolling": an unoptimized-build artifact,
# not a real bug (the optimized build scrolls 200k rows smoothly). So we optimize
# **dependencies** at -O3 in dev to match release-grade scroll smoothness, while
# keeping **our own crates** at opt-level 0 for fast incremental rebuilds +
# debuggability. `package."*"` also matches our crates when they're built as
# dependencies of `schemaic-app`, so each is pinned back to 0 explicitly.
# One-time cost: a full -O3 rebuild of all dependencies (a few minutes, once).
#
# Dev-build **disk**, the other axis, is a measurement (2026-08-13): a 177 GB
# working directory, 166 GB of it `target/debug`, and debug info was most of it —
# 38 GB of `.rlib` + 18 GB of `.pdb` under `deps/`, plus a 102 GB `incremental/`
# cache whose `.o` files carry the same information a second time. So debug info
# is cut on both sides: **off entirely for dependencies** (a backtrace through
# wgpu/cosmic-text is a wall of frames you read the top of) and
# **`line-tables-only` for our own crates** — a panic still names the file and
# line, which is what a backtrace is read for here, without the type/variable
# tables that dominate the object files. `line-tables-only` is restated per crate
# because `package."*"` also matches our crates when they're built as
# dependencies of `schemaic-app`, the same reason `opt-level` is.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.dev.package.schemaic-core]
opt-level = 0
debug = "line-tables-only"
[profile.dev.package.schemaic-db]
opt-level = 0
debug = "line-tables-only"
[profile.dev.package.schemaic-ai]
opt-level = 0
debug = "line-tables-only"
[profile.dev.package.schemaic-term]
opt-level = 0
debug = "line-tables-only"
[profile.dev.package.schemaic-ui]
opt-level = 0
debug = "line-tables-only"
[profile.dev.package.schemaic-app]
opt-level = 0
debug = "line-tables-only"
