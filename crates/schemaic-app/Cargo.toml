[package]
name = "schemaic-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "schemaic"
path = "src/main.rs"

[dependencies]
schemaic-core = { workspace = true }
schemaic-ui = { workspace = true }
schemaic-db = { workspace = true }
schemaic-ai = { workspace = true }
schemaic-term = { workspace = true }
floem = { workspace = true }
tokio = { workspace = true, features = ["process", "io-util", "io-std"] }
tokio-util = { workspace = true }
serde_json = { workspace = true }
sysinfo = { workspace = true }
crossbeam-channel = "0.5"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# Decode the embedded window-icon PNG to RGBA at startup (png feature only).
image = { version = "0.25", default-features = false, features = ["png"] }

# OS keyring for saved connection secrets (DB/SSH passwords + key passphrase), so
# `connections.json` holds no plaintext. Backend is target-gated: Windows Credential
# Manager on Windows, Secret Service (GNOME Keyring / KWallet, via zbus + pure-Rust
# crypto — no libdbus/OpenSSL system dep) on Linux, Keychain on macOS. A machine
# with no working backend degrades gracefully (see `secrets::sanitize_file`).
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Pure-Rust Secret Service (zbus + RustCrypto), NOT `sync-secret-service` — that
# one pulls `dbus-secret-service` → `libdbus-sys`, a C system lib that would break
# the portable glibc-2.31 zigbuild / AppImage build. `async-io` runtime so keyring
# blocks on its own executor (no nested-tokio-runtime hazard).
keyring = { version = "3", default-features = false, features = ["async-secret-service", "async-io", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

# Embed the app icon into the Windows .exe (Explorer/taskbar icon of the file).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
