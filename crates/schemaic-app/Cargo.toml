[package]
name = "schemaic-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "schemaic"
path = "src/main.rs"

[dependencies]
schemaic-core = { workspace = true }
schemaic-conn = { workspace = true }
schemaic-cli = { workspace = true }
schemaic-ui = { workspace = true }
schemaic-db = { workspace = true }
schemaic-ai = { workspace = true }
schemaic-term = { workspace = true }
floem = { workspace = true }
tokio = { workspace = true, features = ["process", "io-util", "io-std"] }
tokio-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sysinfo = { workspace = true }
velopack = { workspace = true }
crossbeam-channel = "0.5"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# Decode the embedded window-icon PNG to RGBA at startup (png feature only).
image = { version = "0.25", default-features = false, features = ["png"] }

# The OS keyring moved to `schemaic-conn` with `secrets.rs`, so the headless CLI
# can reach a saved connection without linking floem. The backend notes that used
# to sit here are in that crate's manifest.

# Settings → Install writes the user PATH (`HKCU\Environment`) and broadcasts
# `WM_SETTINGCHANGE` so Explorer hands the new value to the next terminal. The
# version is the one already in the tree through tokio and friends.
# `Win32_Security` is not optional: `RegCreateKeyExW` takes a
# `SECURITY_ATTRIBUTES` pointer and is compiled out without it. The workspace
# builds either way only because another crate enables it for us.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
] }

# `test-util` for tokio's paused clock, so the statement-timeout tests can let a
# 60-second timeout expire without waiting a minute. Dev-only on purpose: it is
# not a feature a shipped binary should carry.
[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

# Embed the app icon into the Windows .exe (Explorer/taskbar icon of the file).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[lints]
workspace = true
