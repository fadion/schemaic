[package]
name = "schemaic-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
calamine = { workspace = true }
chrono = { workspace = true }
csv = { workspace = true }
rust_xlsxwriter = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sqlparser = { workspace = true }
tracing = { workspace = true }
# An `.xlsx` is a ZIP, and `XLSX_MAX_BYTES` bounds the *compressed* archive — so
# the size that decides whether opening it fits in memory is read from the
# central directory here, before calamine inflates anything. Already in the graph
# under calamine; this is the same crate, asked one question earlier.
zip = { workspace = true }
# `scram` computes PostgreSQL's SCRAM-SHA-256 password verifier, so a role's
# password reaches the server as a verifier and never as text its logs can keep.
# The same three crates and versions `postgres-protocol` (under tokio-postgres)
# already puts in the graph; nothing new enters the lock file.
sha2 = "0.11"
hmac = "0.13"
base64 = "0.22"
# The `md5` verifier, for a cluster whose `password_encryption` is still `md5`:
# a SCRAM verifier there locks out every client that cannot do SCRAM. The same
# crate and version `postgres-protocol` already has in the graph.
md-5 = "0.11"
# SASLprep's mapping tables and NFKC, so `scram` can hash a non-ASCII password
# SASLprep would leave alone. The crates and versions `postgres-protocol` uses
# for its own SASLprep; nothing new enters the lock file.
stringprep = "0.1.5"
unicode-normalization = "0.1.25"

[lints]
workspace = true
