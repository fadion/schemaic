[package]
name = "schemaic-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
schemaic-core = { workspace = true }
schemaic-term = { workspace = true }
floem = { workspace = true }
# The `Renderer` trait (stroke/fill in a custom view's `paint`) isn't re-exported
# by `floem`; pull it directly. Already in the tree via floem — same version.
floem_renderer = "0.2.0"
serde_json = { workspace = true }
# Rasterise the ER diagram's exported SVG to PNG. Already in the tree via floem
# (its `svg` view), same version — no extra compile. `default-features = false`
# +`text`: we want glyph rendering but not the system-font scan, since the export
# is handed the app's own embedded faces (see `erd_raster`).
resvg = { version = "0.43", default-features = false, features = ["text"] }
pulldown-cmark = { version = "0.13.4", default-features = false }

[lints]
workspace = true
