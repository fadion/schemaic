[package]
name = "schemaic-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
schemaic-core = { workspace = true }
schemaic-term = { workspace = true }
# The AI harness identity and its capability predicates, so the settings modal
# can offer the harnesses and hide the controls a given one has no flag for.
#
# **One `Harness`, not a UI-side mirror of it.** The alternative — a parallel
# enum here, converted at the app boundary the way `AiModel`/`AiEffort` are — is
# two definitions free to drift, and that pattern has already cost this app once:
# `AiModel::from_cli` silently coerced any unrecognised model to Haiku, so a
# settings file naming a real model ran a different one with nothing on screen to
# say so. The crate is pure (`serde_json` + `schemaic-core`), so it costs the UI
# no new transitive dependency.
schemaic-ai = { workspace = true }
floem = { workspace = true }
# The `Renderer` trait (stroke/fill in a custom view's `paint`) isn't re-exported
# by `floem`; pull it directly. Already in the tree via floem — same version.
floem_renderer = "0.2.0"
# The salt a PostgreSQL role password is hashed under (`account_editor`'s
# `fresh_salt`). The OS's randomness and nothing else; already in the tree at
# this version.
getrandom = "0.3"
serde_json = { workspace = true }
# Rasterise the ER diagram's exported SVG to PNG. Already in the tree via floem
# (its `svg` view), same version — no extra compile. `text` for glyph rendering;
# `system-fonts` for the fallback behind the app's own embedded faces, for the
# glyphs Plex has none of (see `erd_raster::export_options`). floem_renderer
# already turns both on, so naming them here changes no build.
resvg = { version = "0.43", default-features = false, features = ["text", "system-fonts"] }
pulldown-cmark = { version = "0.13.4", default-features = false }
# **Header reading only** — `blob_view` asks an image its dimensions before
# handing the bytes to floem's `img()`, which decodes to RGBA (width x height x
# 4) and so costs whatever the header *claims* rather than whatever the blob
# weighs. `ImageReader::into_dimensions` reads the header and stops, which is
# the whole of what is needed to refuse a decompression bomb out of a database.
#
# Already in the tree via floem (its own `img`), same version and same compile;
# `default-features = false` because the format decoders come from floem's
# `image-*` features and cargo unions them. Adding a format there is what makes
# it measurable here, which is the coupling `blob::BlobKind` already states.
image = { version = "0.25", default-features = false }
# Grapheme-cluster boundaries, so a cut cell preview never splits a letter from
# its combining mark (`grid::cell_preview`). Already in the tree via floem,
# cosmic-text and winit, same version — no extra compile.
unicode-segmentation = "1.13"
# East Asian width, so the grid's column estimate sizes a wide character as two
# and a combining mark as none (`grid::grid_chars`). Already in the tree at this
# version — no extra compile.
unicode-width = "0.2"
# The interface's string catalogue (`i18n`): Fluent through i18n-embed, whose
# `fl!` checks a message id and its argument names against the `en-GB`
# catalogue at compile time, so a missing key is a build error rather than a
# blank label. The catalogues are embedded (`rust-embed`). GUI only — see
# *The string catalogue* in `docs/architecture/ui-conventions.md`.
i18n-embed = { version = "0.16", features = ["fluent-system"] }
i18n-embed-fl = "0.10"
rust-embed = "8"

[dev-dependencies]
# Parses every embedded catalogue strictly in a test: at run time a malformed
# `.ftl` is only logged, and its broken messages fall back to English unseen.
# Already in the tree under i18n-embed, same version.
fluent-syntax = "0.12"

[lints]
workspace = true
