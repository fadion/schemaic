[package]
name = "schemaic-ui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
schemaic-core = { workspace = true }
schemaic-term = { workspace = true }
floem = { workspace = true }
# The `Renderer` trait (stroke/fill in a custom view's `paint`) isn't re-exported
# by `floem`; pull it directly. Already in the tree via floem — same version.
floem_renderer = "0.2.0"
serde_json = { workspace = true }
# Rasterise the ER diagram's exported SVG to PNG. Already in the tree via floem
# (its `svg` view), same version — no extra compile. `default-features = false`
# +`text`: we want glyph rendering but not the system-font scan, since the export
# is handed the app's own embedded faces (see `erd_raster`).
resvg = { version = "0.43", default-features = false, features = ["text"] }
pulldown-cmark = { version = "0.13.4", default-features = false }
# **Header reading only** — `blob_view` asks an image its dimensions before
# handing the bytes to floem's `img()`, which decodes to RGBA (width x height x
# 4) and so costs whatever the header *claims* rather than whatever the blob
# weighs. `ImageReader::into_dimensions` reads the header and stops, which is
# the whole of what is needed to refuse a decompression bomb out of a database.
#
# Already in the tree via floem (its own `img`), same version and same compile;
# `default-features = false` because the format decoders come from floem's
# `image-*` features and cargo unions them. Adding a format there is what makes
# it measurable here, which is the coupling `blob::BlobKind` already states.
image = { version = "0.25", default-features = false }

[lints]
workspace = true
