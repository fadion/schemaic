# cargo-deny configuration — https://embarkstudios.github.io/cargo-deny/
#
#   cargo install cargo-deny
#   cargo deny check
#
# Guards the dependency tree so a future `cargo update` cannot silently pull in a
# crate whose license is incompatible with shipping Schemaic under MIT.

[licenses]
# Every license we accept. All permissive; MPL-2.0 is weak (file-level) copyleft
# that does not affect our own source. GPL/LGPL are intentionally ABSENT — the
# only crates that mention them are dual-licensed (e.g. self_cell is
# "Apache-2.0 OR GPL-2.0-only"), and cargo-deny satisfies such an OR-expression
# via the permissive branch below, so no GPL terms ever apply.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "BSL-1.0",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
    # `webpki-roots` — Mozilla's CA root certificate set, reached through
    # velopack → ureq → rustls, which is how the updater verifies HTTPS to the
    # GitHub release feed. CDLA-Permissive-2.0 is a *data* license, and a
    # permissive one: use and redistribute freely, no copyleft and no obligation
    # beyond the disclaimer. It's the license the Mozilla bundle ships under, so
    # every Rust TLS stack that trusts public CAs lands here.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

# The bundled IBM Plex fonts (OFL-1.1) are an embedded asset, not a crate, so
# cargo-deny doesn't see them — they're covered in THIRD-PARTY-NOTICES.md.

[advisories]
# Unmaintained crates pulled in transitively (e.g. `paste` via wgpu/floem) can't
# be fixed by us — only flag unmaintained advisories for our own workspace deps.
unmaintained = "workspace"
# Vulnerabilities are denied by default. Each entry below is a conscious, reviewed
# exception — a specific advisory we've assessed as not reachable / not fixable.
#
# **RUSTSEC-2026-0194 and -0195 (quick-xml < 0.41) used to be listed here and are
# not any more, because the condition their own entry named has been met.** The
# tree carried two quick-xml: 0.41 under calamine, which is the one that parses
# an imported `.xlsx` — untrusted XML, the only untrusted XML this app reads —
# and a vulnerable 0.39 under `wayland-scanner`, a Linux-only build-time proc
# macro over Wayland's vendored protocol XML. The old entry said to check the
# version was >= 0.41 before removing them, and `wayland-scanner` 0.31.11 moved
# to 0.41. calamine 0.38 has since moved to 0.42, so the tree holds two again,
# both fixed: 0.42 under calamine and core's plan reader, 0.41 under
# `wayland-scanner`. Do not dedupe a duplicate *downwards* — that would put the
# untrusted parser back on whatever the older one carries.
ignore = [
    # `rsa` "Marvin Attack" timing sidechannel (RSA key recovery). Pulled by russh
    # for RSA SSH key/host support. No patched `rsa` release exists yet. The attack
    # needs fine-grained timing of many RSA operations, impractical against a DB
    # client connecting to known servers. Revisit when `rsa` ships a fix (or drop
    # russh's `rsa` feature if RSA SSH keys aren't needed).
    "RUSTSEC-2023-0071",
    # `zip` < 9.0: SUID/SGID bits kept on extraction (-0367), symlinks whose
    # targets leave the destination (-0368), permissions applied through
    # symlinks (-0369), and an abort sizing a symlink target from its declared
    # length (-0429). All four are in `ZipArchive::extract` and the stream
    # extractor, writing an archive out to disk — and nothing in this tree calls
    # either (checked again for -0429, now that `schemaic import` opens an
    # `.xlsx` with nobody at the keyboard: calamine and core read entries only). calamine (an imported `.xlsx`) and core's `import`/`export` open an
    # archive in memory and read entries by name; rust_xlsxwriter only writes;
    # velopack never extracts through `zip`. calamine 0.38 moved to `zip` 9 and
    # the workspace `zip` moved with it, so both readers of an imported `.xlsx`
    # are on the fixed line; 8 stays in the lock only under rust_xlsxwriter
    # (which writes) and velopack. Remove these when both of those move to 9,
    # or sooner if anything here starts extracting an archive to disk.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
    "RUSTSEC-2026-0429",
    # `zip` < 9.0 again, on the same zip 8 under rust_xlsxwriter and velopack:
    # AES entries returned without checking their MAC (-0545), `extract`
    # escaping the destination through symlinks (-0546), the legacy Shrink/
    # Reduce/Implode decoders preallocating a declared size (-0547), and
    # `ZipStreamReader` naming entries by their local header (-0548, fixed in
    # 9.0.5; the workspace's zip 9 is past that). Unreachable here: -0545 needs
    # zip's `aes-crypto` feature and -0547 its `legacy-zip`, and neither is on
    # (`cargo tree -i zip@8.6.0 -e features`); -0546 is `extract`, which
    # nothing calls; and nothing uses `ZipStreamReader` (velopack's `bundle`
    # opens a `ZipArchive` in memory and reads entries). velopack's newest
    # release, 1.2.161, still asks for `zip` ^8.6, which is what keeps 8 in the
    # tree. Remove these with the four above.
    "RUSTSEC-2026-0545",
    "RUSTSEC-2026-0546",
    "RUSTSEC-2026-0547",
    "RUSTSEC-2026-0548",
    # `chrono` is unmaintained (an informational advisory, with no patched
    # version). It is flagged because core and db name it directly
    # (`unmaintained = "workspace"`), but arrow (under DuckDB) and russh-util
    # pull it too, so replacing our own use with `jiff` or `time` would not take
    # it out of the tree. Remove this when the workspace stops depending on it
    # directly.
    "RUSTSEC-2026-0543",
]

[bans]
# Duplicate versions are common in a GUI + async tree; surface them without
# failing the build.
multiple-versions = "warn"
wildcards = "allow"

[sources]
# Only crates.io. A dependency pulled from an unknown registry or a git URL fails.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
