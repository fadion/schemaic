# cargo-deny configuration — https://embarkstudios.github.io/cargo-deny/
#
#   cargo install cargo-deny
#   cargo deny check
#
# Guards the dependency tree so a future `cargo update` cannot silently pull in a
# crate whose license is incompatible with shipping Schemaic under MIT.

[licenses]
# Every license we accept. All permissive; MPL-2.0 is weak (file-level) copyleft
# that does not affect our own source. GPL/LGPL are intentionally ABSENT — the
# only crates that mention them are dual-licensed (e.g. self_cell is
# "Apache-2.0 OR GPL-2.0-only"), and cargo-deny satisfies such an OR-expression
# via the permissive branch below, so no GPL terms ever apply.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "BSL-1.0",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
    # `webpki-roots` — Mozilla's CA root certificate set, reached through
    # velopack → ureq → rustls, which is how the updater verifies HTTPS to the
    # GitHub release feed. CDLA-Permissive-2.0 is a *data* license, and a
    # permissive one: use and redistribute freely, no copyleft and no obligation
    # beyond the disclaimer. It's the license the Mozilla bundle ships under, so
    # every Rust TLS stack that trusts public CAs lands here.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

# The bundled IBM Plex fonts (OFL-1.1) are an embedded asset, not a crate, so
# cargo-deny doesn't see them — they're covered in THIRD-PARTY-NOTICES.md.

[advisories]
# Unmaintained crates pulled in transitively (e.g. `paste` via wgpu/floem) can't
# be fixed by us — only flag unmaintained advisories for our own workspace deps.
unmaintained = "workspace"
# Vulnerabilities are denied by default. Each entry below is a conscious, reviewed
# exception — a specific advisory we've assessed as not reachable / not fixable.
ignore = [
    # quick-xml < 0.41 quadratic-time attribute parsing (DoS). Only exploitable
    # via UNTRUSTED XML input, and the *vulnerable* copy never sees any — nor,
    # on Windows, is it built at all. `cargo tree -i quick-xml@0.39.4 -e
    # normal,build --target all` has exactly one consumer:
    #
    #   quick-xml 0.39.4 <- wayland-scanner (proc-macro) <- smithay-client-toolkit
    #                    <- floem-winit <- floem
    #
    # a build-time proc macro over Wayland's own protocol XML, on Linux only.
    # Its input is vendored, it runs at compile time, and nothing it produces
    # parses anything at runtime.
    #
    # (An earlier version of this entry said 0.39 was reached "through
    # usvg/resvg". It is not: usvg parses SVG with roxmltree, and is not a
    # consumer of either quick-xml version. Following that sentence would have
    # meant watching floem's SVG stack for an upgrade that can never come from
    # there, while the crate that *does* pull 0.39 went unwatched.)
    #
    # Revisit when the winit/wayland stack moves — wayland-scanner <-
    # smithay-client-toolkit <- floem-winit is the upgrade path, not the
    # renderer.
    #
    # Schemaic *does* now parse untrusted XML — an imported `.xlsx` is a ZIP of
    # it, and the file comes from wherever the user got it. That path goes
    # through calamine, which depends on quick-xml **0.41**: the patched
    # version, and the reason the tree carries two. So the duplicate that
    # `[bans] multiple-versions = "warn"` reports here is load-bearing rather
    # than untidy — deduplicating it *downwards* would put the untrusted parser
    # on the vulnerable code. If a future change makes these resolve to one
    # version, check it is >= 0.41 before removing these ignores.
    "RUSTSEC-2026-0194",
    # quick-xml < 0.41 unbounded namespace-declaration allocation (memory-exhaustion
    # DoS). Same reachability + upgrade situation as RUSTSEC-2026-0194 above.
    "RUSTSEC-2026-0195",
    # `rsa` "Marvin Attack" timing sidechannel (RSA key recovery). Pulled by russh
    # for RSA SSH key/host support. No patched `rsa` release exists yet. The attack
    # needs fine-grained timing of many RSA operations, impractical against a DB
    # client connecting to known servers. Revisit when `rsa` ships a fix (or drop
    # russh's `rsa` feature if RSA SSH keys aren't needed).
    "RUSTSEC-2023-0071",
]

[bans]
# Duplicate versions are common in a GUI + async tree; surface them without
# failing the build.
multiple-versions = "warn"
wildcards = "allow"

[sources]
# Only crates.io. A dependency pulled from an unknown registry or a git URL fails.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
